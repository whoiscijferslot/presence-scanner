<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00ff00;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0.3"/>
    </linearGradient>
    <!-- Clip path for rounded corners (iPhone style ~22% radius) -->
    <clipPath id="roundedCorners">
      <rect width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>
  
  <!-- Apply rounded corners to everything -->
  <g clip-path="url(#roundedCorners)">
    <!-- Background -->
    <rect width="64" height="64" fill="#0a0a0a"/>
    
    <!-- Scanlines effect -->
    <rect width="64" height="64" fill="url(#scanline)" opacity="0.3"/>
    
    <!-- Border -->
    <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="none" stroke="#00aa00" stroke-width="2"/>
    
    <!-- Inner glow border -->
    <rect x="4" y="4" width="56" height="56" rx="10" ry="10" fill="none" stroke="#004400" stroke-width="1"/>
    
    <!-- Radar circles -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#003300" stroke-width="1"/>
    <circle cx="32" cy="32" r="15" fill="none" stroke="#003300" stroke-width="1"/>
    <circle cx="32" cy="32" r="8" fill="none" stroke="#004400" stroke-width="1"/>
    
    <!-- Radar sweep line -->
    <line x1="32" y1="32" x2="32" y2="10" stroke="#00ff00" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Cross hairs -->
    <line x1="32" y1="6" x2="32" y2="14" stroke="#00aa00" stroke-width="1"/>
    <line x1="32" y1="50" x2="32" y2="58" stroke="#00aa00" stroke-width="1"/>
    <line x1="6" y1="32" x2="14" y2="32" stroke="#00aa00" stroke-width="1"/>
    <line x1="50" y1="32" x2="58" y2="32" stroke="#00aa00" stroke-width="1"/>
    
    <!-- Detection blips -->
    <circle cx="26" cy="24" r="3" fill="#00ff00" filter="url(#glow)"/>
    <circle cx="40" cy="38" r="3" fill="#00ff00" filter="url(#glow)"/>
    
    <!-- Center dot -->
    <circle cx="32" cy="32" r="2" fill="#00ff00" filter="url(#glow)"/>
  </g>
</svg>
