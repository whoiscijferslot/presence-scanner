# Prek configuration - pre-commit hooks in Rust
# https://github.com/cloudflare/prek

[[hook]]
name = "ruff-check"
command = "uv run ruff check --fix"
files = ["\\.py$"]
pass_filenames = true

[[hook]]
name = "ruff-format"
command = "uv run ruff format"
files = ["\\.py$"]
pass_filenames = true

[[hook]]
name = "ty"
command = "ty check"
files = ["\\.py$"]
pass_filenames = false
