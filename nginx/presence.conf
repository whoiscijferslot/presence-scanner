# Presence scanner API - manual scan trigger
location = /presence/api/scan {
    proxy_pass http://127.0.0.1:5031/scan;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    limit_except POST { deny all; }
}

# Presence scanner page - redirect to trailing slash
location = /presence {
    return 301 /presence/;
}

# Presence scanner page - IMPORTANT: both location and alias MUST have trailing slashes
# to prevent path traversal vulnerability (e.g., /presence../etc/passwd)
location /presence/ {
    alias /home/sam1902/projects/presence-scanner/www/;
    index index.html;

    # Disable caching for JSON files
    if ($request_uri ~* "\.json$") {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
