# Presence Scanner - Proxy to FastAPI app
# Copy to /etc/nginx/sites-available/<your-domain>.d/locations/presence.conf

# Presence scanner - proxy all requests to FastAPI
location /presence/ {
    proxy_pass http://127.0.0.1:5031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Redirect /presence to /presence/
location = /presence {
    return 301 /presence/;
}
