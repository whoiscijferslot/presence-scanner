[project]
name = "presence-scanner"
version = "2.0.0"
description = "Network presence detection for home automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
    "cryptography>=43.0.0",
]

[project.scripts]
presence-scanner = "presence_scanner.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presence_scanner"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle - we use docstrings but not strict format
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # single line implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Standalone, uv-runnable client script moved into the package verbatim.
"zyxel_client.py" = ["T201"]

[tool.ty.environment]
python-version = "3.12"
