[project]
name = "presence-scanner"
version = "2.0.0"
description = "Network presence detection for home automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
]

[project.scripts]
presence-scanner = "presence_scanner.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence_scanner"]

[dependency-groups]
dev = []
